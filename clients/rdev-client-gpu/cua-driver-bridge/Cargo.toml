[package]
name = "rdev-cua-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false


[lib]
crate-type = ["rlib", "staticlib"]
[features]
default = []
cua-native = ["dep:tokio", "dep:libc", "dep:uuid", "dep:cua-driver-sdk", "dep:platform-macos", "dep:rquickjs-sys"]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"], optional = true }
libc = { version = "0.2", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }
cua-driver-sdk = { git = "https://github.com/trycua/cua.git", tag = "cua-driver-rs-v0.47.1", default-features = false, optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
platform-macos = { git = "https://github.com/trycua/cua.git", tag = "cua-driver-rs-v0.47.1", package = "platform-macos", default-features = false, optional = true }

# QuickJS does not ship pre-generated bindings for the LLVM-MinGW ARM64 target.
[target.'cfg(all(target_os = "windows", target_arch = "aarch64", target_env = "gnu"))'.dependencies]
rquickjs-sys = { version = "0.14.0", features = ["bindgen"], optional = true }
