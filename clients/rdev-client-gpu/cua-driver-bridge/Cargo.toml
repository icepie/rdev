[package]
name = "rdev-cua-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = []
cua-native = ["dep:tokio", "dep:reqwest", "dep:sha2", "dep:tar", "dep:flate2", "dep:zip", "dep:dirs", "dep:fs2", "dep:libc", "dep:uuid", "dep:windows-sys"]

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "time", "sync"], optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"], optional = true }
sha2 = { version = "0.10", optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
dirs = { version = "6", optional = true }
fs2 = { version = "0.4", optional = true }
libc = { version = "0.2", optional = true }
uuid = { version = "1", features = ["v4"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", optional = true, features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
