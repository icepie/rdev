plugins { id 'com.android.application' }

android {
    namespace 'dev.icepie.rdev'
    compileSdk 37

    defaultConfig {
        applicationId 'dev.icepie.rdev'
        minSdk 21
        targetSdk 33
        versionCode 120
        versionName '0.2.120'
    }

    packaging {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation 'io.jpower.kcp:kcp-netty:1.5.2'
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    testImplementation 'junit:junit:4.13.2'
}
