plugins { id 'com.android.application' }

android {
    namespace 'dev.icepie.rdev'
    compileSdk 36

    defaultConfig {
        applicationId 'dev.icepie.rdev'
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName '0.1.0'
    }

    packaging {
        resources {
            excludes += ['META-INF/INDEX.LIST', 'META-INF/io.netty.versions.properties']
        }
    }
}

dependencies {
    implementation 'io.jpower.kcp:kcp-netty:1.5.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
