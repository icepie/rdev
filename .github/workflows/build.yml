name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

env:
  GO_WIN7_VERSION: 'patched-1.26.4'
  UPX_VERSION: '4.2.4'
  # Shared release linker flags for every Go target. Compression is chosen per
  # platform by scripts/ci/build-go.sh, never implied by these flags.
  RDEV_LDFLAGS: '-s -w -X main.version=${{ github.ref_name }}'

jobs:
  # ── Web assets are built exactly once and reused by every Go job ──
  web:
    name: Build web UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install web dependencies
        run: |
          bun install --frozen-lockfile

      - name: Typecheck web UI
        run: bun run typecheck

      - name: Test web UI
        run: bun run test:web

      - name: Test POSIX installer without OpenSSL
        run: node --test scripts/test-runner-downloads.mjs

      - name: Build web UI
        run: |
          bun run build

      - name: Upload web UI
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: internal/server/static
          if-no-files-found: error
          retention-days: 3

  test:
    name: Test
    needs: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Download web UI
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: internal/server/static

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "gofmt needed:"
            echo "$files"
            exit 1
          fi

      - name: Test
        run: go test ./...

      - name: Build check
        run: |
          CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/rdev-server
          CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/rdev-client
          CGO_ENABLED=0 go build -trimpath -tags go264_nohwaccel -o /dev/null ./cmd/rdev-client

  test-installers:
    name: Test Windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Windows PowerShell without OpenSSL
        shell: powershell
        run: ./scripts/test-runner-release.ps1
      - name: PowerShell 7 without OpenSSL
        shell: pwsh
        run: ./scripts/test-runner-release.ps1

  # ── Standard builds (linux, darwin) ───────────────────────────
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Download web UI
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: internal/server/static

      - name: Install UPX
        run: |
          curl -fSL --retry 3 -o /tmp/upx.tar.xz \
            "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz"
          tar xf /tmp/upx.tar.xz -C /tmp
          sudo cp "/tmp/upx-${UPX_VERSION}-amd64_linux/upx" /usr/local/bin/

      - name: Build & compress server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: scripts/ci/build-go.sh ./cmd/rdev-server "rdev-server${{ matrix.ext }}" upx

      - name: Build & compress client
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: scripts/ci/build-go.sh ./cmd/rdev-client "rdev-client${{ matrix.ext }}" upx

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: rdev-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            rdev-server${{ matrix.ext }}
            rdev-client${{ matrix.ext }}



  # ── Android/Termux client builds (Bionic + libc DNS) ─────────
  build-android:
    name: Build android/${{ matrix.name }} client
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64
            goarch: arm64
            goarm: ''
            cc: aarch64-linux-android24-clang
          - name: armv7
            goarch: arm
            goarm: '7'
            cc: armv7a-linux-androideabi24-clang
          - name: amd64
            goarch: amd64
            goarm: ''
            cc: x86_64-linux-android24-clang
          - name: x86
            goarch: 386
            goarm: ''
            cc: i686-linux-android24-clang
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - uses: android-actions/setup-android@v4

      - name: Install Android NDK
        run: sdkmanager "ndk;27.1.12297006"

      - name: Build Android client
        env:
          GOOS: android
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ matrix.cc }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          if [ -n "${{ matrix.goarm }}" ]; then export GOARM="${{ matrix.goarm }}"; fi
          # Pion's anet dependency accesses net.zoneCache on Android; Go 1.23+ requires this opt-in.
          # Compression is explicitly disabled: UPX strips PT_INTERP (/system/bin/linker64)
          # and Android 10+ blocks the self-decompressing stub, so this ships as a PIE.
          scripts/ci/build-go.sh ./cmd/rdev-client rdev-client none "-checklinkname=0"
          file rdev-client
          readelf -l rdev-client | grep -q 'program interpreter' || {
            echo "Android client lost its PT_INTERP interpreter" >&2
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rdev-android-${{ matrix.name }}
          path: rdev-client

  # ── Windows build using go-win7 for amd64/386; standard Go for arm64 ─
  build-windows:
    name: Build windows (go-win7 amd64/386)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Download web UI
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: internal/server/static

      - name: Cache go-win7
        id: cache-go-win7
        uses: actions/cache@v6
        with:
          path: /home/runner/go-win7
          key: go-win7-${{ env.GO_WIN7_VERSION }}

      - name: Download go-win7
        if: steps.cache-go-win7.outputs.cache-hit != 'true'
        run: |
          curl -fSL --retry 5 --retry-delay 10 --connect-timeout 30 --max-time 300 \
            -o go-win7.zip \
            "https://github.com/XTLS/go-win7/releases/download/${GO_WIN7_VERSION}/go-for-win7-linux-amd64.zip"
          mkdir -p /home/runner/go-win7
          unzip -oq go-win7.zip -d /home/runner/go-win7
          test -x /home/runner/go-win7/bin/go
          /home/runner/go-win7/bin/go version

      - name: Install UPX
        run: |
          curl -fSL --retry 3 -o /tmp/upx.tar.xz \
            "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/upx-${UPX_VERSION}-amd64_linux.tar.xz"
          tar xf /tmp/upx.tar.xz -C /tmp
          sudo cp "/tmp/upx-${UPX_VERSION}-amd64_linux/upx" /usr/local/bin/

      - name: Build & compress windows/amd64
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
          GOROOT: /home/runner/go-win7
        run: |
          export PATH="/home/runner/go-win7/bin:$PATH"
          scripts/ci/build-go.sh ./cmd/rdev-server dist/windows-amd64/rdev-server.exe upx
          scripts/ci/build-go.sh ./cmd/rdev-client dist/windows-amd64/rdev-client.exe upx

      - name: Build & compress windows/386 client
        env:
          GOOS: windows
          GOARCH: 386
          CGO_ENABLED: 0
          GOROOT: /home/runner/go-win7
        run: |
          export PATH="/home/runner/go-win7/bin:$PATH"
          scripts/ci/build-go.sh ./cmd/rdev-client dist/windows-386/rdev-client.exe upx

      - name: Build & compress windows/arm64
        env:
          GOOS: windows
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          scripts/ci/build-go.sh ./cmd/rdev-server dist/windows-arm64/rdev-server.exe upx
          scripts/ci/build-go.sh ./cmd/rdev-client dist/windows-arm64/rdev-client.exe upx

      - name: Upload windows/amd64
        uses: actions/upload-artifact@v7
        with:
          name: rdev-windows-amd64
          path: |
            dist/windows-amd64/rdev-server.exe
            dist/windows-amd64/rdev-client.exe

      - name: Upload windows/386 client
        uses: actions/upload-artifact@v7
        with:
          name: rdev-windows-386
          path: dist/windows-386/rdev-client.exe

      - name: Upload windows/arm64
        uses: actions/upload-artifact@v7
        with:
          name: rdev-windows-arm64
          path: |
            dist/windows-arm64/rdev-server.exe
            dist/windows-arm64/rdev-client.exe

  # ── Real browser smoke: web assets + Go server + Go client ───
  browser-smoke:
    name: Browser smoke (terminal + files)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_VERSION: '1.65.1'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - uses: oven-sh/setup-bun@v2

      - name: Download web UI
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: internal/server/static

      - name: Build service binaries
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          scripts/ci/build-go.sh ./cmd/rdev-server "$RUNNER_TEMP/bin/rdev-server" none
          scripts/ci/build-go.sh ./cmd/rdev-client "$RUNNER_TEMP/bin/rdev-client" none

      - name: Install Playwright Chromium
        run: |
          bunx "playwright@${PLAYWRIGHT_VERSION}" install --with-deps chromium
          mkdir -p "$RUNNER_TEMP/playwright"
          cd "$RUNNER_TEMP/playwright"
          bun add "playwright@${PLAYWRIGHT_VERSION}"

      - name: Run browser smoke
        run: |
          node scripts/ci/browser-smoke.mjs \
            --server "$RUNNER_TEMP/bin/rdev-server" \
            --client "$RUNNER_TEMP/bin/rdev-client" \
            --playwright-root "$RUNNER_TEMP/playwright" \
            --artifacts "$RUNNER_TEMP/browser-smoke-artifacts"

      - name: Upload browser smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-smoke-artifacts
          path: ${{ runner.temp }}/browser-smoke-artifacts
          if-no-files-found: warn

  # ── Release (only on v* tags) ────────────────────────────────
  release:
    name: Release
    needs: [test, test-installers, build, build-android, build-windows, browser-smoke]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          # web-dist is a build input, never a release asset.
          pattern: rdev-*
          path: artifacts

      - name: Rename for release
        run: |
          cd artifacts
          for dir in rdev-*; do
            if [ -d "$dir" ]; then
              os_arch=${dir#rdev-}
              for f in "$dir"/*; do
                base=$(basename "$f")
                name="${base%.*}"
                ext="${base##*.}"
                if [ "$ext" = "$base" ]; then ext=""; else ext=".$ext"; fi
                mv "$f" "${name}-${os_arch}${ext}"
              done
            fi
          done
          find . -mindepth 1 -maxdepth 1 -type d -name 'rdev-*' -exec rm -rf -- {} +
          echo "=== Release files ==="
          ls -lh

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      # Never publish assets that auto-updaters cannot authenticate.
      - name: Sign release assets
        env:
          RDEV_UPDATE_SIGNING_KEY: ${{ secrets.RDEV_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$RDEV_UPDATE_SIGNING_KEY" ]; then
            echo "::error::RDEV_UPDATE_SIGNING_KEY is required for release publication"
            exit 1
          fi
          go run ./scripts/sign -key "$RDEV_UPDATE_SIGNING_KEY" artifacts/*
          ls -lh artifacts/*.sig

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: artifacts/*
