name: Rust Client

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_NET_RETRY: 5
  CARGO_HTTP_MULTIPLEXING: false

concurrency:
  group: rust-client-rs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/rdev-client-rs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/rdev-client-rs -> target

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - uses: oven-sh/setup-bun@v2

      - name: Build web UI
        working-directory: .
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Smoke test
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass rsync
          make rust-client-rs-smoke

  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A stalled dependency clone used to hold a runner for over an hour.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64-debian13
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: rdev-client-rs
            asset: rdev-client-rs-linux-amd64
            package_linux: true
            linux_distro: debian13
            linux_image: debian:13
            builder_suffix: debian13-amd64
            linux_features: embedded-rdev-desktop-wayland,cua-native
            enable_vaapi: y
            arch: amd64
          - name: linux-amd64-debian12
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: rdev-client-rs
            asset: rdev-client-rs-linux-amd64-debian12
            package_linux: true
            linux_distro: debian12
            linux_image: debian:12
            builder_suffix: debian12-amd64
            linux_features: embedded-rdev-desktop,cua-native
            enable_vaapi: n
            arch: amd64
          - name: linux-amd64-debian11
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: rdev-client-rs
            asset: rdev-client-rs-linux-amd64-debian11
            package_linux: true
            linux_distro: debian11
            linux_image: debian:11
            builder_suffix: debian11-amd64
            linux_features: embedded-rdev-desktop,cua-native
            enable_vaapi: n
            arch: amd64
          - name: linux-amd64-centos7
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: rdev-client-rs
            asset: rdev-client-rs-linux-amd64-centos7
            package_linux: true
            linux_distro: centos7
            linux_image: centos:7
            builder_suffix: centos7-amd64
            linux_features: embedded-rdev-desktop
            enable_vaapi: n
            arch: amd64
          - name: linux-amd64-centos8
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: rdev-client-rs
            asset: rdev-client-rs-linux-amd64-centos8
            package_linux: true
            linux_distro: centos8
            linux_image: rockylinux:8
            builder_suffix: centos8-amd64
            linux_features: embedded-rdev-desktop
            enable_vaapi: n
            arch: amd64
          - name: linux-arm64-debian13
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: rdev-client-rs
            asset: rdev-client-rs-linux-arm64
            package_linux: true
            linux_distro: debian13
            linux_image: debian:13
            builder_suffix: debian13-arm64
            linux_features: embedded-rdev-desktop-wayland,cua-native
            enable_vaapi: y
            arch: arm64
          - name: linux-arm64-debian12
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: rdev-client-rs
            asset: rdev-client-rs-linux-arm64-debian12
            package_linux: true
            linux_distro: debian12
            linux_image: debian:12
            builder_suffix: debian12-arm64
            linux_features: embedded-rdev-desktop,cua-native
            enable_vaapi: n
            arch: arm64
          - name: linux-arm64-debian11
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: rdev-client-rs
            asset: rdev-client-rs-linux-arm64-debian11
            package_linux: true
            linux_distro: debian11
            linux_image: debian:11
            builder_suffix: debian11-arm64
            linux_features: embedded-rdev-desktop,cua-native
            enable_vaapi: n
            arch: arm64
          - name: linux-arm64-centos8
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: rdev-client-rs
            asset: rdev-client-rs-linux-arm64-centos8
            package_linux: true
            linux_distro: centos8
            linux_image: rockylinux:8
            builder_suffix: centos8-arm64
            linux_features: embedded-rdev-desktop
            enable_vaapi: n
            arch: arm64
          - name: windows-amd64
            os: ubuntu-latest
            target: x86_64-pc-windows-gnu
            artifact: rdev-client-rs.exe
            asset: rdev-client-rs-windows-amd64
            llvm_mingw: msvcrt
            desktop_features: embedded-rdev-desktop,cua-native
          - name: windows-arm64
            os: windows-2025
            target: aarch64-pc-windows-msvc
            artifact: rdev-client-rs.exe
            asset: rdev-client-rs-windows-arm64
            desktop_features: embedded-rdev-desktop,cua-native
          - name: windows-win7-amd64
            os: ubuntu-latest
            target: x86_64-pc-windows-gnullvm
            artifact: rdev-client-rs.exe
            asset: rdev-client-rs-windows-win7-amd64
            llvm_mingw: msvcrt
            win7: true
          - name: darwin-amd64
            os: macos-26-intel
            target: x86_64-apple-darwin
            artifact: rdev-client-rs
            asset: rdev-client-rs-darwin-amd64
            deployment_target: '10.13'
            desktop_features: embedded-rdev-desktop,cua-native
          - name: darwin-arm64
            os: macos-26
            target: aarch64-apple-darwin
            artifact: rdev-client-rs
            asset: rdev-client-rs-darwin-arm64
            deployment_target: '11.0'
            desktop_features: embedded-rdev-desktop,cua-native
          - name: android-arm64
            os: ubuntu-latest
            target: aarch64-linux-android
            artifact: rdev-client-rs
            asset: rdev-client-rs-android-arm64
            android: true
            android_cc: aarch64-linux-android24-clang
          - name: android-armv7
            os: ubuntu-latest
            target: armv7-linux-androideabi
            artifact: rdev-client-rs
            asset: rdev-client-rs-android-armv7
            android: true
            android_cc: armv7a-linux-androideabi24-clang
          - name: android-amd64
            os: ubuntu-latest
            target: x86_64-linux-android
            artifact: rdev-client-rs
            asset: rdev-client-rs-android-amd64
            android: true
            android_cc: x86_64-linux-android24-clang
          - name: android-x86
            os: ubuntu-latest
            target: i686-linux-android
            artifact: rdev-client-rs
            asset: rdev-client-rs-android-x86
            android: true
            android_cc: i686-linux-android24-clang
    defaults:
      run:
        working-directory: clients/rdev-client-rs
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Initialize Windows ARM64 MSVC environment
        if: matrix.target == 'aarch64-pc-windows-msvc'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64_arm64

      - name: Install Windows pkg-config
        if: matrix.target == 'aarch64-pc-windows-msvc'
        run: choco install pkgconfiglite --yes --no-progress

      - uses: android-actions/setup-android@v4
        if: matrix.android == true

      - name: Install Android NDK dependencies
        if: matrix.android == true
        run: |
          sdkmanager "ndk;27.1.12297006"
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          ANDROID_NDK_BIN="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_BIN=$ANDROID_NDK_BIN" >> "$GITHUB_ENV"
          echo "$ANDROID_NDK_BIN" >> "$GITHUB_PATH"
          case "${{ matrix.target }}" in
            aarch64-linux-android)
              echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${{ matrix.android_cc }}" >> "$GITHUB_ENV"
              echo "CC_aarch64_linux_android=${{ matrix.android_cc }}" >> "$GITHUB_ENV"
              ;;
            armv7-linux-androideabi)
              echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=${{ matrix.android_cc }}" >> "$GITHUB_ENV"
              echo "CC_armv7_linux_androideabi=${{ matrix.android_cc }}" >> "$GITHUB_ENV"
              ;;
            x86_64-linux-android)
              echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=${{ matrix.android_cc }}" >> "$GITHUB_ENV"
              echo "CC_x86_64_linux_android=${{ matrix.android_cc }}" >> "$GITHUB_ENV"
              ;;
            i686-linux-android)
              echo "CARGO_TARGET_I686_LINUX_ANDROID_LINKER=${{ matrix.android_cc }}" >> "$GITHUB_ENV"
              echo "CC_i686_linux_android=${{ matrix.android_cc }}" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Install Windows LLVM MinGW dependencies
        if: contains(fromJSON('["msvcrt","ucrt"]'), matrix.llvm_mingw)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm nasm yasm pkg-config make python3 xz-utils
          LLVM_MINGW_VERSION=20260602
          LLVM_MINGW_CRT='${{ matrix.llvm_mingw }}'
          LLVM_MINGW_URL="https://github.com/mstorsjo/llvm-mingw/releases/download/${LLVM_MINGW_VERSION}/llvm-mingw-${LLVM_MINGW_VERSION}-${LLVM_MINGW_CRT}-ubuntu-22.04-x86_64.tar.xz"
          curl -fSL --retry 5 --retry-delay 10 -o /tmp/llvm-mingw.tar.xz "$LLVM_MINGW_URL"
          mkdir -p /opt/llvm-mingw
          tar -xf /tmp/llvm-mingw.tar.xz -C /opt/llvm-mingw --strip-components=1
          echo /opt/llvm-mingw/bin >> "$GITHUB_PATH"
          if [ '${{ matrix.target }}' = 'x86_64-pc-windows-gnu' ]; then
            sudo apt-get install -y gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix
            # Ubuntu's cross-GCC can fall back to its configured GNU ld before
            # searching PATH for ld.lld. Install LLD beside both cross-ld paths.
            sudo ln -sf /usr/bin/ld.lld /usr/bin/x86_64-w64-mingw32-ld.lld
            sudo ln -sf /usr/bin/ld.lld /usr/x86_64-w64-mingw32/bin/ld.lld
            {
              echo 'CC_x86_64_pc_windows_gnu=/usr/bin/x86_64-w64-mingw32-gcc-posix'
              echo 'CXX_x86_64_pc_windows_gnu=/usr/bin/x86_64-w64-mingw32-g++-posix'
              echo 'AR_x86_64_pc_windows_gnu=/usr/bin/x86_64-w64-mingw32-ar'
              echo 'MINGW_GCC=/usr/bin/x86_64-w64-mingw32-gcc-posix'
              echo 'RDEV_MINGW_CC=/usr/bin/x86_64-w64-mingw32-gcc-posix'
              echo 'RDEV_MINGW_CXX=/usr/bin/x86_64-w64-mingw32-g++-posix'
              echo 'RDEV_MINGW_CRT=msvcrt'
              echo 'CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=/usr/bin/x86_64-w64-mingw32-gcc-posix'
            } >> "$GITHUB_ENV"
          elif [ '${{ matrix.target }}' = 'x86_64-pc-windows-gnullvm' ]; then
            {
              echo 'CC_x86_64_pc_windows_gnullvm=x86_64-w64-mingw32-clang'
              echo 'CXX_x86_64_pc_windows_gnullvm=x86_64-w64-mingw32-clang++'
              echo 'AR_x86_64_pc_windows_gnullvm=llvm-ar'
              echo 'MINGW_GCC=x86_64-w64-mingw32-clang'
              echo 'RDEV_MINGW_CC=x86_64-w64-mingw32-clang'
              echo 'RDEV_MINGW_CXX=x86_64-w64-mingw32-clang++'
              echo 'RDEV_MINGW_CRT=msvcrt'
              echo 'CARGO_TARGET_X86_64_PC_WINDOWS_GNULLVM_LINKER=x86_64-w64-mingw32-clang'
            } >> "$GITHUB_ENV"
          else
            {
              echo 'CC_aarch64_pc_windows_gnullvm=aarch64-w64-mingw32-clang'
              echo 'CXX_aarch64_pc_windows_gnullvm=aarch64-w64-mingw32-clang++'
              echo 'AR_aarch64_pc_windows_gnullvm=llvm-ar'
              echo 'RDEV_MINGW_CC=aarch64-w64-mingw32-clang'
              echo 'RDEV_MINGW_CXX=aarch64-w64-mingw32-clang++'
              echo 'CARGO_TARGET_AARCH64_PC_WINDOWS_GNULLVM_LINKER=aarch64-w64-mingw32-clang'
            } >> "$GITHUB_ENV"
          fi

      - name: Test MinGW runtime packager
        if: matrix.target == 'x86_64-pc-windows-gnu'
        run: python3 scripts/test_copy_mingw_runtime.py

      - name: Install macOS build dependencies
        if: startsWith(matrix.target, 'x86_64-apple') || startsWith(matrix.target, 'aarch64-apple')
        run: brew install nasm yasm pkg-config

      - name: Install UPX
        if: runner.os == 'Linux'
        run: |
          arch=$(dpkg --print-architecture)
          curl -fSL --retry 5 --retry-delay 10 -o /tmp/upx.tar.xz \
            "https://github.com/upx/upx/releases/download/v4.2.4/upx-4.2.4-${arch}_linux.tar.xz"
          tar xf /tmp/upx.tar.xz -C /tmp
          sudo cp "/tmp/upx-4.2.4-${arch}_linux/upx" /usr/local/bin/
          upx --version | head -1

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: clients/rdev-client-rs -> target
          key: desktop-${{ matrix.target }}-${{ matrix.name }}

      - name: Log in to GHCR for Linux builder image
        if: matrix.package_linux == true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Linux package Rust toolchain
        if: matrix.package_linux == true
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/env
            ~/.rustup/toolchains
            ~/.rustup/update-hashes
          key: rustup-linux-package-${{ runner.os }}-${{ runner.arch }}-stable

      - name: Set Linux builder image
        if: matrix.package_linux == true
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          IMAGE_SUFFIX: ${{ matrix.builder_suffix }}
        run: |
          owner=$(printf '%s' "$IMAGE_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "RDEV_GPU_BUILDER_IMAGE=ghcr.io/${owner}/rdev-rs-builder:${IMAGE_SUFFIX}" >> "$GITHUB_ENV"

      - name: Build Linux embedded desktop package
        if: matrix.package_linux == true
        working-directory: .
        env:
          CARGO_NET_RETRY: 5
          RDEV_GPU_PROXY: ${{ vars.RDEV_GPU_PROXY }}
          RDEV_GPU_APT_MIRROR: ${{ vars.RDEV_GPU_APT_MIRROR }}
          RDEV_GPU_CARGO_REGISTRY: ${{ vars.RDEV_GPU_CARGO_REGISTRY }}
          RDEV_GPU_RUSTUP_DIST_SERVER: ${{ vars.RDEV_GPU_RUSTUP_DIST_SERVER }}
          RDEV_GPU_RUSTUP_UPDATE_ROOT: ${{ vars.RDEV_GPU_RUSTUP_UPDATE_ROOT }}
          RDEV_GPU_TARGET: ${{ matrix.target }}
          RDEV_GPU_ARCH: ${{ matrix.arch }}
          RDEV_GPU_RUST_TOOLCHAIN: stable
          RDEV_VERSION: ${{ github.ref_name }}
          RDEV_GPU_ASSET: ${{ matrix.asset }}
          RDEV_GPU_FEATURES: ${{ matrix.linux_features }}
          ENABLE_VAAPI: ${{ matrix.enable_vaapi }}
          ENABLE_NVENC: n
          TMPDIR: /tmp
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cargo" "$HOME/.rustup" clients/rdev-client-rs/target
          image="$RDEV_GPU_BUILDER_IMAGE"
          # An unset `docker run -e NAME` removes the image's ENV default.
          # Prebuilt builders already contain system dependencies.
          export RDEV_GPU_INSTALL_DEPS=n
          if ! docker pull "$image"; then
            echo "::warning::prebuilt Linux builder image $image is unavailable; falling back to ${{ matrix.linux_image }}"
            image="${{ matrix.linux_image }}"
            export RDEV_GPU_INSTALL_DEPS=auto
          fi
          echo "::group::${RDEV_GPU_ASSET} ($image)"
          docker run --rm \
            -v "$PWD:/work" \
            -v "$HOME/.cargo:/root/.cargo" \
            -v "$HOME/.rustup:/root/.rustup" \
            -w /work \
            -e CARGO_NET_RETRY \
            -e RDEV_GPU_PROXY \
            -e RDEV_GPU_APT_MIRROR \
            -e RDEV_GPU_CARGO_REGISTRY \
            -e RDEV_GPU_RUSTUP_DIST_SERVER \
            -e RDEV_GPU_RUSTUP_UPDATE_ROOT \
            -e RDEV_GPU_TARGET \
            -e RDEV_GPU_ARCH \
            -e RDEV_GPU_RUST_TOOLCHAIN \
            -e RDEV_VERSION \
            -e RDEV_GPU_ASSET \
            -e RDEV_GPU_FEATURES \
            -e ENABLE_VAAPI \
            -e ENABLE_NVENC \
            -e TMPDIR \
            -e RDEV_GPU_INSTALL_DEPS \
            "$image" \
            bash clients/rdev-client-rs/scripts/package-linux-desktop.sh "${{ matrix.linux_distro }}"
          sudo chown -R "$USER:$USER" clients/rdev-client-rs/dist clients/rdev-client-rs/target "$HOME/.cargo" "$HOME/.rustup"
          echo "::endgroup::"

      - name: Build Android Termux release
        if: matrix.android == true
        env:
          RDEV_VERSION: ${{ github.ref_name }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Build embedded desktop release
        if: matrix.package_linux != true && matrix.android != true
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.deployment_target }}
          RDEV_VERSION: ${{ github.ref_name }}
        run: cargo build --release --features '${{ matrix.desktop_features || 'embedded-rdev-desktop' }}' --target ${{ matrix.target }}

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ matrix.package_linux }}" = "true" ]; then
            found=0
            for package_dir in dist/${{ matrix.asset }}*; do
              [ -d "$package_dir" ] || continue
              found=1
              package_name="$(basename "$package_dir")"
              [ -s "$package_dir/VERSION.txt" ] || echo "rdev-client-rs" > "$package_dir/VERSION.txt"
              upx --best "$package_dir/rdev-client-rs" || true
              tar -C dist -czf "dist/${package_name}.tar.gz" "$package_name"
            done
            [ "$found" = "1" ] || { echo "no Linux packages found for ${{ matrix.asset }}" >&2; exit 1; }
          elif [ "${{ matrix.win7 }}" = "true" ]; then
            mkdir -p "dist/${{ matrix.asset }}"
            python3 win7/patch_imports.py \
              "target/${{ matrix.target }}/release/${{ matrix.artifact }}" \
              "dist/${{ matrix.asset }}/rdev-client-rs.exe"
            python3 win7/build_shims.py "dist/${{ matrix.asset }}"
            python3 win7/copy_winpty_runtime.py "dist/${{ matrix.asset }}"
            python3 scripts/copy_mingw_runtime.py \
              --dist-dir "dist/${{ matrix.asset }}" \
              --search-root /opt/llvm-mingw/x86_64-w64-mingw32 \
              --dll libc++.dll \
              --dll libunwind.dll \
              --dll libwinpthread-1.dll
            echo "rdev-client-rs ${GITHUB_REF_NAME}" > "dist/${{ matrix.asset }}/VERSION.txt"
            (cd dist && python3 -m zipfile -c "${{ matrix.asset }}.zip" "${{ matrix.asset }}")
          elif [ "${{ matrix.android }}" = "true" ]; then
            mkdir -p "dist/${{ matrix.asset }}"
            cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "dist/${{ matrix.asset }}/rdev-client-rs"
            chmod +x "dist/${{ matrix.asset }}/rdev-client-rs"
            # UPX removes PT_INTERP; Android 10+ refuses to run its stub.
            readelf -l "dist/${{ matrix.asset }}/rdev-client-rs" | grep -q 'program interpreter' || {
              echo "Android Rust client lost its PT_INTERP interpreter" >&2
              exit 1
            }
            echo "rdev-client-rs ${GITHUB_REF_NAME}" > "dist/${{ matrix.asset }}/VERSION.txt"
            tar -C dist -czf "dist/${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
          elif [[ "${{ matrix.target }}" == x86_64-pc-windows-gnu ]]; then
            mkdir -p "dist/${{ matrix.asset }}"
            cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "dist/${{ matrix.asset }}/rdev-client-rs.exe"
            python3 scripts/copy_mingw_runtime.py \
              --dist-dir "dist/${{ matrix.asset }}" \
              --search-root /usr/x86_64-w64-mingw32 \
              --search-root /usr/lib/gcc/x86_64-w64-mingw32
            # Keep Windows binaries unpacked: the UPX-packed release crashed at process start (0xC0000005).
            echo "rdev-client-rs ${GITHUB_REF_NAME}" > "dist/${{ matrix.asset }}/VERSION.txt"
            (cd dist && python3 -m zipfile -c "${{ matrix.asset }}.zip" "${{ matrix.asset }}")
          elif [[ "${{ matrix.target }}" == *windows* ]]; then
            mkdir -p "dist/${{ matrix.asset }}"
            cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "dist/${{ matrix.asset }}/rdev-client-rs.exe"
            # Keep Windows binaries unpacked: the UPX-packed release crashed at process start (0xC0000005).
            echo "rdev-client-rs ${GITHUB_REF_NAME}" > "dist/${{ matrix.asset }}/VERSION.txt"
            (cd dist && python3 -m zipfile -c "${{ matrix.asset }}.zip" "${{ matrix.asset }}")
          else
            mkdir -p "dist/${{ matrix.asset }}"
            cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "dist/${{ matrix.asset }}/rdev-client-rs"
            chmod +x "dist/${{ matrix.asset }}/rdev-client-rs"
            if [[ "${{ matrix.target }}" == *apple-darwin ]]; then
              xcrun swift-stdlib-tool --copy \
                --scan-executable "dist/${{ matrix.asset }}/rdev-client-rs" \
                --destination "dist/${{ matrix.asset }}/Frameworks" \
                --platform macosx
              # Modern macOS must load its system Swift runtime before the
              # bundled pre-10.14.4 compatibility libraries.
              if ! otool -l "dist/${{ matrix.asset }}/rdev-client-rs" | grep -Fq 'path /usr/lib/swift '; then
                install_name_tool -add_rpath /usr/lib/swift \
                  "dist/${{ matrix.asset }}/rdev-client-rs"
              fi
              install_name_tool -add_rpath "@executable_path/Frameworks" \
                "dist/${{ matrix.asset }}/rdev-client-rs"
            fi
            echo "rdev-client-rs ${GITHUB_REF_NAME}" > "dist/${{ matrix.asset }}/VERSION.txt"
            if command -v otool >/dev/null 2>&1; then
              otool -L "dist/${{ matrix.asset }}/rdev-client-rs" > "dist/${{ matrix.asset }}/BUILD_INFO.txt" || true
            fi
            "dist/${{ matrix.asset }}/rdev-client-rs" --version
            tar -C dist -czf "dist/${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            clients/rdev-client-rs/dist/${{ matrix.asset }}*.tar.gz
            clients/rdev-client-rs/dist/${{ matrix.asset }}*.zip
          if-no-files-found: error

  # ── Code signing (release tags and manual runs) ───────────────
  # Same credentials as nicecode-tools and the Go release: see
  # docs/release-signing.md. The packaged archives are rebuilt in place so the
  # published bytes carry the signatures.
  sign-windows:
    name: Sign ${{ matrix.asset }}
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: true
      matrix:
        asset: [rdev-client-rs-windows-amd64, rdev-client-rs-windows-arm64, rdev-client-rs-windows-win7-amd64]
    steps:
      - uses: actions/checkout@v7

      - name: Download ${{ matrix.asset }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.asset }}
          path: package

      - name: Prepare Authenticode signer
        shell: pwsh
        env:
          EVSIGN_LICENSE_KEY: ${{ secrets.EVSIGN_LICENSE_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:EVSIGN_LICENSE_KEY) { throw 'Missing EVSIGN_LICENSE_KEY secret' }
          $client = Join-Path $env:RUNNER_TEMP 'evsign-client.exe'
          Invoke-WebRequest 'https://mc.evsign.cn/evsign-client-cli-windows-latest' -OutFile $client
          "EVSIGN_CLIENT=$client" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Sign the packaged payload and rebuild the archive
        shell: pwsh
        env:
          EVSIGN_LICENSE_KEY: ${{ secrets.EVSIGN_LICENSE_KEY }}
          ASSET: ${{ matrix.asset }}
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive -LiteralPath "package/$env:ASSET.zip" -DestinationPath unpacked -Force
          ./scripts/ci/sign-windows.ps1 "unpacked/$env:ASSET"
          Remove-Item -LiteralPath "package/$env:ASSET.zip" -Force
          Compress-Archive -Path "unpacked/$env:ASSET" -DestinationPath "package/$env:ASSET.zip" -Force

      - name: Publish signed package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: package/${{ matrix.asset }}.zip
          if-no-files-found: error
          overwrite: true

  sign-darwin:
    name: Sign ${{ matrix.asset }}
    needs: build
    runs-on: macos-15
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: true
      matrix:
        asset: [rdev-client-rs-darwin-amd64, rdev-client-rs-darwin-arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Download ${{ matrix.asset }}
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.asset }}
          path: package

      - name: Prepare Developer ID signing
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: scripts/ci/apple-signing-setup.sh

      - name: Sign the payload, notarize it and rebuild the archive
        env:
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/rust-sign"
          rm -rf "$work"; mkdir -p "$work"
          tar -C "$work" -xzf "package/$ASSET.tar.gz"
          scripts/ci/sign-darwin.sh "$work/$ASSET"
          rm -f "package/$ASSET.tar.gz"
          tar -C "$work" -czf "package/$ASSET.tar.gz" "$ASSET"
          tar -tzf "package/$ASSET.tar.gz" | head -5

      - name: Publish signed package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: package/${{ matrix.asset }}.tar.gz
          if-no-files-found: error
          overwrite: true

      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "${APPLE_NOTARY_KEYCHAIN}" || true
          rm -f "${RUNNER_TEMP}/rdev-signing.p12" "${RUNNER_TEMP}/rdev-notary.p8"

  windows-smoke:
    name: Smoke ${{ matrix.asset }}
    needs: [build, sign-windows]
    # sign-windows is skipped off release tags; the smoke test still has to run.
    if: ${{ always() && !cancelled() }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        asset: [rdev-client-rs-windows-amd64, rdev-client-rs-windows-win7-amd64]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.asset }}
          path: package

      - name: Run packaged client on Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive "package/${{ matrix.asset }}.zip" unpacked
          $exe = (Resolve-Path "unpacked/${{ matrix.asset }}/rdev-client-rs.exe").Path
          $process = Start-Process $exe -ArgumentList '--version' -PassThru -NoNewWindow `
            -RedirectStandardOutput version.txt -RedirectStandardError stderr.txt
          $handle = $process.Handle
          if (!$process.WaitForExit(30000)) {
            $process.Kill()
            throw 'Packaged client startup timed out'
          }
          $process.WaitForExit()
          Get-Content stderr.txt
          # Get-Content returns null for an empty file; preserve the startup exit code.
          $version = ([string](Get-Content version.txt -Raw)).Trim()
          if ($process.ExitCode -ne 0 -or !$version) {
            throw ('Packaged client failed to start: exit={0} (0x{0:X8}), output={1}' -f $process.ExitCode, $version)
          }
          if ('${{ github.ref }}'.StartsWith('refs/tags/v') -and $version -ne '${{ github.ref_name }}') {
            throw "Unexpected packaged version: $version"
          }
          Write-Output $version

  release:
    name: Release Rust client
    needs: [test, build, windows-smoke, sign-windows, sign-darwin]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          echo "=== Rust release files ==="
          ls -lh release

      # Never publish assets that auto-updaters cannot authenticate.
      - name: Sign release assets
        env:
          RDEV_UPDATE_SIGNING_KEY: ${{ secrets.RDEV_UPDATE_SIGNING_KEY }}
        run: |
          if [ -z "$RDEV_UPDATE_SIGNING_KEY" ]; then
            echo "::error::RDEV_UPDATE_SIGNING_KEY is required for release publication"
            exit 1
          fi
          go run ./scripts/sign -key "$RDEV_UPDATE_SIGNING_KEY" release/*
          ls -lh release/*.sig

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release/*
