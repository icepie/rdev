<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="/boot.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title.batch">RDev - Batch</title>
    <style>:root{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark}:root[data-theme=dark]{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--text:#e4e4e7;--muted:#71717a;--accent:#22d3ee;--green:#4ade80;--red:#f87171;--yellow:#facc15}:root[data-theme=light]{--lightningcss-light:initial;--lightningcss-dark: ;color-scheme:light;--bg:#f6f8fb;--card:#fff;--border:#d8dee9;--text:#1f2937;--muted:#6b7280;--accent:#0891b2;--green:#16a34a;--red:#dc2626;--yellow:#ca8a04}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:var(--text);min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif}.container{max-width:1440px;margin:0 auto;padding:1.5rem}header{justify-content:space-between;align-items:center;margin-bottom:1.5rem;display:flex}header h1{font-size:1.5rem;font-weight:700}header h1 span{color:var(--accent)}.nav{gap:8px;display:flex}.lang-switch{color:var(--muted);align-items:center;gap:6px;font-size:.78rem;display:inline-flex}.nav a{border:1px solid var(--border);color:var(--muted);border-radius:7px;padding:6px 14px;font-size:.85rem;text-decoration:none;transition:all .15s}.nav a:hover,.nav a.active{border-color:var(--accent);color:var(--accent)}.device-panel{background:var(--card);border:1px solid var(--border);border-radius:10px;margin-bottom:1rem;padding:1rem}.device-panel h3{color:var(--accent);margin-bottom:.6rem;font-size:.85rem}.device-grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;display:grid}.device-item{cursor:pointer;border:1px solid #0000;border-radius:6px;align-items:center;gap:8px;padding:6px 10px;font-size:.85rem;transition:all .15s;display:flex}.device-item:hover{background:#ffffff08}.device-item.selected{border-color:var(--accent);background:#22d3ee0f}.device-item input{accent-color:var(--accent)}.device-item .dot{background:var(--green);width:7px;height:7px;box-shadow:0 0 5px var(--green);border-radius:50%;flex-shrink:0}.device-item.offline .dot{background:var(--red);box-shadow:none}.select-all{color:var(--muted);cursor:pointer;margin-bottom:6px;font-size:.8rem}.select-all:hover{color:var(--accent)}.tabs{gap:2px;margin-bottom:1rem;display:flex}.tab{cursor:pointer;border:1px solid var(--border);background:var(--card);color:var(--muted);border-bottom:none;border-radius:8px 8px 0 0;padding:8px 18px;font-size:.85rem;transition:all .15s}.tab:hover{color:var(--text)}.tab.active{color:var(--accent);border-color:var(--accent);background:var(--bg);position:relative;top:1px}.tab-panel{background:var(--card);border:1px solid var(--border);border-radius:0 10px 10px;padding:1.2rem;display:none}.tab-panel.active{display:block}.exec-row{gap:10px;margin-bottom:.8rem;display:flex}.exec-input{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:8px;outline:none;flex:1;padding:10px 14px;font-family:SF Mono,Fira Code,monospace;font-size:.9rem}.exec-input:focus{border-color:var(--accent)}.exec-btn{background:var(--accent);color:var(--bg);cursor:pointer;border:none;border-radius:8px;padding:10px 22px;font-size:.9rem;font-weight:600;transition:opacity .15s}.exec-btn:hover{opacity:.85}.exec-btn:disabled{opacity:.3;cursor:not-allowed}.upload-zone{border:2px dashed var(--border);text-align:center;cursor:pointer;border-radius:10px;margin-bottom:1rem;padding:2rem;transition:all .15s}.upload-zone:hover,.upload-zone.dragover{border-color:var(--accent);background:#22d3ee0a}.upload-zone .icon{opacity:.4;margin-bottom:.5rem;font-size:2rem}.upload-zone .hint{color:var(--muted);font-size:.85rem}.upload-zone .filename{color:var(--accent);margin-top:.3rem;font-size:.9rem;font-weight:600}.path-row{align-items:center;gap:10px;margin-bottom:1rem;display:flex}.path-input{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:7px;outline:none;flex:1;padding:8px 12px;font-family:SF Mono,Fira Code,monospace;font-size:.85rem}.path-input:focus{border-color:var(--accent)}.upload-btn{background:var(--accent);color:var(--bg);cursor:pointer;border:none;border-radius:8px;padding:10px 22px;font-size:.9rem;font-weight:600}.upload-btn:disabled{opacity:.3;cursor:not-allowed}.results{margin-top:1rem}#exec-results,#upload-results{grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:8px;display:grid}.result-card{background:var(--bg);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;overflow:hidden}.result-header{border-bottom:1px solid var(--border);justify-content:space-between;align-items:center;padding:8px 12px;font-size:.8rem;display:flex}.result-header .device{color:var(--text);font-weight:600}.result-header .exit{border-radius:5px;padding:2px 8px;font-size:.75rem}.result-header .exit.ok{color:var(--green);background:#4ade801f}.result-header .exit.fail{color:var(--red);background:#f871711f}.result-header .exit.running{color:var(--accent);background:#22d3ee1f}.result-body{color:var(--muted);white-space:pre-wrap;max-height:200px;padding:8px 12px;font-family:SF Mono,Fira Code,monospace;font-size:.8rem;line-height:1.5;overflow-y:auto}.empty{text-align:center;color:var(--muted);padding:2rem;font-size:.85rem}@media (width<=760px){.container{padding:1rem}header{flex-direction:column;align-items:stretch;gap:.8rem;margin-bottom:1rem}header h1{font-size:1.3rem}.nav{padding-bottom:2px;overflow-x:auto}.nav a{flex:none;padding:7px 10px}.device-panel,.tab-panel{padding:.9rem}.device-grid,#exec-results,#upload-results{grid-template-columns:1fr}.tabs{margin-bottom:0;overflow-x:auto}.tab{flex:none;padding:9px 14px}.tab-panel{border-radius:0 0 10px 10px}.exec-row,.path-row{flex-direction:column;align-items:stretch}.exec-input,.path-input{font-size:16px}.exec-btn,.upload-btn{width:100%;padding:11px 16px}.upload-zone{padding:1.2rem}.result-header{flex-direction:column;align-items:flex-start;gap:6px}.result-body{max-height:36dvh;font-size:.78rem}}</style>
</head>
<body>
    <div class="container">
        <header>
            <h1><span>RDev</span> <span data-i18n="nav.batch">Batch</span></h1>
            <div id="lang-slot"></div>
            <div class="nav">
                <a href="/" data-auth-link data-i18n="nav.dashboard">Dashboard</a>
                <a href="/terminal" data-auth-link data-i18n="nav.terminal">Terminal</a>
                <a href="/sessions" data-auth-link data-i18n="nav.sessions">Sessions</a>
                <a href="/files" data-auth-link data-i18n="nav.files">Files</a>
                <a href="/batch" data-auth-link class="active" data-i18n="nav.batch">Batch</a>
            </div>
        </header>

        <!-- Device selector -->
        <div class="device-panel">
            <h3 class="icon-inline"><span data-icon="radio"></span><span data-i18n="batch.devices">Target Devices</span></h3>
            <div class="select-all" id="select-all" data-i18n="batch.selectAll">Select all</div>
            <div class="device-grid" id="device-grid"></div>
        </div>

        <!-- Tab panels: Exec / Upload -->
        <div class="tabs">
            <div class="tab active icon-inline" data-tab="exec"><span data-icon="terminal"></span><span data-i18n="batch.commandTab">Batch Command</span></div>
            <div class="tab icon-inline" data-tab="upload"><span data-icon="folder"></span><span data-i18n="batch.uploadTab">File Distribution</span></div>
        </div>

        <div class="tab-panel active" id="panel-exec">
            <div class="exec-row">
                <input type="text" class="exec-input" id="exec-cmd" data-i18n-placeholder="batch.commandPlaceholder" placeholder="Command to run on selected devices..." spellcheck="false" autocomplete="off">
                <button class="exec-btn" id="exec-run" data-i18n="batch.run">Run</button>
            </div>
            <div class="results" id="exec-results"></div>
        </div>

        <div class="tab-panel" id="panel-upload">
            <div class="upload-zone" id="drop-zone">
                <div class="empty-icon" data-icon="upload"></div>
                <div class="hint" data-i18n="batch.dropHint">Click or drag file here</div>
                <div class="filename" id="upload-name"></div>
            </div>
            <input type="file" id="file-input" style="display:none">
            <div class="path-row">
                <span data-icon="upload" style="color:var(--muted);font-size:0.85rem"></span>
                <input type="text" class="path-input" id="dest-path" data-i18n-placeholder="batch.destPlaceholder" placeholder="Destination path" spellcheck="false" autocomplete="off">
                <button class="upload-btn" id="upload-run" data-i18n="batch.distribute">Distribute</button>
            </div>
            <div class="results" id="upload-results"></div>
        </div>
    </div>

    <script src="/i18n.js"></script>
    <script src="/ui.js"></script>
    <script>

    document.getElementById('lang-slot').innerHTML = RDevUI.themeButton() + RDevI18n.langSelector();
    RDevI18n.apply();
    document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon); });
    window.addEventListener('rdev:langchange', () => { if (typeof renderDevices === 'function') renderDevices(); if (typeof renderList === 'function') renderList(); });

    const adminToken = new URLSearchParams(location.search).get('token') || localStorage.getItem('rdevAdminToken') || '';
    if (adminToken) localStorage.setItem('rdevAdminToken', adminToken);
    function authURL(path) { return adminToken ? path + (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(adminToken) : path; }
    async function authFetch(path, init) {
        const r = await fetch(authURL(path), init);
        if (r.status === 401) {
            const token = await RDevUI.prompt({ title: t('common.adminTokenRequired'), message: t('common.adminTokenRequired'), type: 'password' });
            if (token) { localStorage.setItem('rdevAdminToken', token); location.search = 'token=' + encodeURIComponent(token); }
        }
        return r;
    }
    document.querySelectorAll('[data-auth-link]').forEach(a => a.href = authURL(a.getAttribute('href')));

    // ---- Device list ----
    let devices = [];
    let selectedDevices = new Set();
    let uploadedFile = null;
    let uploadedName = '';
    const uploadAcks = new Map();

    async function loadDevices() {
        try {
            const r = await fetch('/api/batch/devices');
            devices = await r.json();
            renderDevices();
        } catch(e) {}
    }

    function renderDevices() {
        const grid = document.getElementById('device-grid');
        if (!devices.length) {
            grid.innerHTML = '<div style="color:var(--muted);font-size:0.85rem">' + t('common.noDevices') + '</div>';
            return;
        }
        grid.innerHTML = devices.map(d => {
            const sel = selectedDevices.has(d.id) ? 'selected' : '';
            return `<div class="device-item ${sel}" data-id="${esc(d.id)}">
                <input type="checkbox" ${sel ? 'checked' : ''}>
                <span class="dot"></span>
                <span class="icon-inline">${esc(d.id)}${d.hasPassword ? icon('lock') : ''}</span>
            </div>`;
        }).join('');

        grid.querySelectorAll('.device-item').forEach(el => {
            el.addEventListener('click', () => {
                const id = el.dataset.id;
                if (selectedDevices.has(id)) selectedDevices.delete(id);
                else selectedDevices.add(id);
                renderDevices();
                updateButtons();
            });
        });
        updateButtons();
    }

    document.getElementById('select-all').addEventListener('click', () => {
        if (selectedDevices.size === devices.length) selectedDevices.clear();
        else devices.forEach(d => selectedDevices.add(d.id));
        renderDevices();
    });

    function updateButtons() {
        const hasDevices = selectedDevices.size > 0;
        document.getElementById('exec-run').disabled = !hasDevices;
        document.getElementById('upload-run').disabled = !hasDevices || !uploadedFile;
    }

    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
    function selectedDeviceObjects() { return [...selectedDevices].map(id => devices.find(d => d.id === id)).filter(Boolean); }

    function openBatchWS() {
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        return RDevUI.socket(`${proto}//${location.host}/batch`);
    }

    function authDevice(ws, device, password) {
        if (!device.hasPassword) return Promise.resolve(true);
        return new Promise(resolve => {
            const onMessage = (evt) => {
                if (evt.data instanceof ArrayBuffer) return;
                let msg;
                try { msg = JSON.parse(evt.data); } catch { return; }
                if ((msg.op === 'auth_ok' || msg.op === 'auth_fail') && msg.deviceId === device.id) {
                    ws.removeEventListener('message', onMessage);
                    resolve(msg.op === 'auth_ok');
                }
            };
            ws.addEventListener('message', onMessage);
            ws.send(JSON.stringify({ op: 'auth', deviceId: device.id, password }));
        });
    }

    async function authorizeSelectedDevices(ws) {
        const locked = selectedDeviceObjects().filter(d => d.hasPassword);
        if (!locked.length) return true;
        const saved = locked.map(d => RDevUI.getDevicePassword(d.id)).find(Boolean);
        if (saved) {
            let allSavedOk = true;
            for (const device of locked) {
                const ok = await authDevice(ws, device, saved);
                if (!ok) {
                    allSavedOk = false;
                    RDevUI.forgetDevicePassword(device.id);
                }
            }
            if (allSavedOk) return true;
            await RDevUI.alert({ title: t('common.error'), message: t('common.passwordWrong') });
        }
        const password = await RDevUI.prompt({ title: t('common.password'), message: t('batch.passwordRequired', {ids: locked.map(d => d.id).join(', ')}), type: 'password' });
        if (password === null) return false;
        for (const device of locked) {
            const ok = await authDevice(ws, device, password);
            if (!ok) {
                RDevUI.forgetDevicePassword(device.id);
                await RDevUI.alert({ title: t('common.error'), message: t('batch.wrongPassword', {id: device.id}) });
                return false;
            }
            RDevUI.rememberDevicePassword(device.id, password);
        }
        return true;
    }

    function decodeBinFrame(buf) {
        const view = new DataView(buf);
        const typ = view.getUint8(0);
        const idLen = view.getUint8(1);
        const devId = new TextDecoder().decode(new Uint8Array(buf, 2, idLen));
        const payload = new Uint8Array(buf, 2 + idLen);
        return { typ, devId, payload };
    }

    // ---- Tabs ----
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            tab.classList.add('active');
            document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
        });
    });

    // ---- Batch Exec ----
    document.getElementById('exec-run').addEventListener('click', runBatchExec);
    document.getElementById('exec-cmd').addEventListener('keydown', e => { if (e.key === 'Enter') runBatchExec(); });

    function runBatchExec() {
        const cmd = document.getElementById('exec-cmd').value.trim();
        if (!cmd || !selectedDevices.size) return;

        const results = document.getElementById('exec-results');
        // Create result cards
        const deviceList = [...selectedDevices];
        results.innerHTML = deviceList.map(id => `<div class="result-card" id="result-${esc(id)}">
            <div class="result-header">
                <span class="device">${esc(id)}</span>
                <span class="exit running">${t('batch.running')}</span>
            </div>
            <div class="result-body" id="output-${esc(id)}"></div>
        </div>`).join('');

        const ws = openBatchWS();
        ws.binaryType = 'arraybuffer'; // for binary output frames

        ws.onopen = async () => {
            if (!(await authorizeSelectedDevices(ws))) { ws.close(); return; }
            ws.send(JSON.stringify({ op: 'exec', devices: deviceList, command: cmd }));
        };

        ws.onmessage = (evt) => {
            if (evt.data instanceof ArrayBuffer) {
                // Binary frame = exec output [0x01] [devIdLen] [devId] [raw output]
                const { devId, payload } = decodeBinFrame(evt.data);
                const el = document.getElementById('output-' + devId);
                if (el) el.textContent += new TextDecoder().decode(payload);
            } else {
                // Text frame = JSON control
                const msg = JSON.parse(evt.data);
                if (msg.deviceId && msg.op === 'exec_exit') {
                    const card = document.getElementById('result-' + msg.deviceId);
                    if (card) {
                        const badge = card.querySelector('.exit');
                        badge.className = 'exit ' + (msg.code === 0 ? 'ok' : 'fail');
                        badge.textContent = t('batch.exitCode', {code: msg.code});
                    }
                    const allDone = deviceList.every(id => {
                        const c = document.getElementById('result-' + id);
                        return c && !c.querySelector('.exit.running');
                    });
                    if (allDone) ws.close();
                } else if (msg.op === 'error' || msg.op === 'auth_required') {
                    if (msg.deviceId) {
                        const el = document.getElementById('output-' + msg.deviceId);
                        if (el) el.textContent += '\n[' + t('common.error') + ': ' + msg.message + ']';
                        const card = document.getElementById('result-' + msg.deviceId);
                        if (card) {
                            const badge = card.querySelector('.exit');
                            if (badge && badge.classList.contains('running')) { badge.className = 'exit fail'; badge.textContent = msg.op === 'auth_required' ? t('batch.authRequired') : t('common.error'); }
                        }
                    } else {
                        results.innerHTML += `<div style="color:var(--red);font-size:0.85rem;padding:8px">${t('common.error')}: ${esc(msg.message)}</div>`;
                    }
                }
            }
        };

        ws.onerror = () => {};
        ws.onclose = () => {};
    }

    // ---- File Upload ----
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');

    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
    dropZone.addEventListener('drop', e => {
        e.preventDefault(); dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFile(fileInput.files[0]); });

    function handleFile(file) {
        uploadedName = file.name;
        document.getElementById('upload-name').textContent = file.name + ' (' + (file.size/1024).toFixed(1) + ' KB)';
        if (!document.getElementById('dest-path').value) {
            document.getElementById('dest-path').value = '/tmp/' + file.name;
        }

        uploadedFile = file;
        updateButtons();
    }

    document.getElementById('upload-run').addEventListener('click', runBatchUpload);

    function encodeFileStart(id, meta, mode) {
        const enc = new TextEncoder();
        const idBytes = enc.encode(id);
        const metaBytes = enc.encode(JSON.stringify(meta));
        const buf = new ArrayBuffer(2 + idBytes.length + 2 + metaBytes.length + 4);
        const view = new DataView(buf); let pos = 0;
        view.setUint8(pos++, 0x05); view.setUint8(pos++, idBytes.length);
        new Uint8Array(buf, pos, idBytes.length).set(idBytes); pos += idBytes.length;
        view.setUint16(pos, metaBytes.length); pos += 2;
        new Uint8Array(buf, pos, metaBytes.length).set(metaBytes); pos += metaBytes.length;
        view.setUint32(pos, mode);
        return buf;
    }
    function encodeChunk(id, data) {
        const idBytes = new TextEncoder().encode(id), chunk = new Uint8Array(data);
        const buf = new ArrayBuffer(2 + idBytes.length + chunk.length), out = new Uint8Array(buf);
        out[0] = 0x06; out[1] = idBytes.length; out.set(idBytes, 2); out.set(chunk, 2 + idBytes.length);
        return buf;
    }
    function encodeEnd(id) {
        const idBytes = new TextEncoder().encode(id), buf = new ArrayBuffer(2 + idBytes.length), out = new Uint8Array(buf);
        out[0] = 0x07; out[1] = idBytes.length; out.set(idBytes, 2); return buf;
    }

    function runBatchUpload() {
        if (!uploadedFile || !selectedDevices.size) return;
        const destPath = document.getElementById('dest-path').value.trim();
        if (!destPath) return;
        const deviceList = [...selectedDevices];
        const results = document.getElementById('upload-results');
        results.innerHTML = deviceList.map(id => `<div class="result-card" id="upload-result-${esc(id)}">
            <div class="result-header"><span class="device">${esc(id)}</span><span class="exit running">${t('batch.uploading')}</span></div>
            <div class="result-body" id="upload-output-${esc(id)}">${esc(destPath)}</div>
        </div>`).join('');

        const ws = openBatchWS();
        ws.binaryType = 'arraybuffer';
        const uploadId = `upload-${Date.now().toString(36)}-${Math.random().toString(36).slice(2)}`;

        ws.onopen = async () => {
            if (!(await authorizeSelectedDevices(ws))) { ws.close(); return; }
            ws.send(encodeFileStart(uploadId, { devices: deviceList, path: destPath, mode: 420 }, 420));
            for (let offset = 0; offset < uploadedFile.size; offset += 512 * 1024) {
                const chunk = await uploadedFile.slice(offset, offset + 512 * 1024).arrayBuffer();
                ws.send(encodeChunk(uploadId, chunk));
                await new Promise(resolve => uploadAcks.set(uploadId, resolve));
            }
            ws.send(encodeEnd(uploadId));
        };

        ws.onmessage = (evt) => {
            if (evt.data instanceof ArrayBuffer) {
                const { typ, devId } = decodeBinFrame(evt.data);
                if (typ === 0x08 && uploadAcks.has(devId)) { uploadAcks.get(devId)(); uploadAcks.delete(devId); }
                return;
            }
            const msg = JSON.parse(evt.data);
            if (msg.deviceId && msg.op === 'upload_result') {
                const card = document.getElementById('upload-result-' + msg.deviceId);
                if (card) {
                    const badge = card.querySelector('.exit');
                    badge.className = 'exit ' + (msg.success ? 'ok' : 'fail');
                    badge.textContent = msg.success ? t('common.ok') : (msg.message || t('common.failed'));
                }
            } else if ((msg.op === 'error' || msg.op === 'auth_required') && msg.deviceId) {
                const card = document.getElementById('upload-result-' + msg.deviceId);
                if (card) {
                    const badge = card.querySelector('.exit');
                    badge.className = 'exit fail';
                    badge.textContent = msg.message || (msg.op === 'auth_required' ? t('batch.authRequired') : t('common.error'));
                }
            }
            const allDone = deviceList.every(id => {
                const c = document.getElementById('upload-result-' + id);
                return c && !c.querySelector('.exit.running');
            });
            if (allDone) ws.close();
        };
    }

    // ---- Init ----
    loadDevices();
    setInterval(loadDevices, 5000);
    </script>
</body>
</html>
