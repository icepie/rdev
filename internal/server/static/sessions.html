    <title data-i18n="title.sessions">RDev - Session Manager</title>
    <link rel="stylesheet" href="/vendor/xterm.css">
    <style>:root{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark}:root[data-theme=dark]{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--text:#e4e4e7;--muted:#71717a;--accent:#22d3ee;--green:#4ade80;--red:#f87171;--yellow:#facc15;--purple:#c084fc}:root[data-theme=light]{--lightningcss-light:initial;--lightningcss-dark: ;color-scheme:light;--bg:#f6f8fb;--card:#fff;--border:#d8dee9;--text:#1f2937;--muted:#6b7280;--accent:#0891b2;--green:#16a34a;--red:#dc2626;--yellow:#ca8a04;--purple:#9333ea}*{box-sizing:border-box;margin:0;padding:0}.icon{vertical-align:-.16em;flex-shrink:0;width:1em;height:1em}.icon-inline{align-items:center;gap:6px;display:inline-flex}.empty-icon{opacity:.32;color:var(--accent);justify-content:center;align-items:center;margin-bottom:1rem;font-size:3rem;display:inline-flex}.theme-toggle{border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;border-radius:7px;align-items:center;gap:6px;padding:4px 8px;font-size:.78rem;display:inline-flex}.theme-toggle:hover{color:var(--accent);border-color:var(--accent)}body{background:var(--bg);color:var(--text);flex-direction:column;height:100dvh;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;display:flex;overflow:hidden}.toolbar{background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0;align-items:center;gap:10px;padding:6px 12px;display:flex}.toolbar .logo{color:var(--accent);white-space:nowrap;font-size:.85rem;font-weight:600}.toolbar .logo span{color:var(--muted);font-weight:400}.spacer{flex:1}.gh-link{color:var(--muted);font-size:.85rem;text-decoration:none}.gh-link:hover{color:var(--accent)}.lang-switch{color:var(--muted);align-items:center;gap:6px;font-size:.78rem;display:inline-flex}.nav{gap:6px;display:flex}.nav a{border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:4px 10px;font-size:.78rem;text-decoration:none;transition:all .15s}.nav a:hover{color:var(--accent);border-color:var(--accent)}.split{flex:1;min-height:0;display:flex;overflow:hidden}.list-panel{background:var(--card);border-right:1px solid var(--border);flex-direction:column;flex-shrink:0;width:360px;min-width:260px;display:flex}.list-header{border-bottom:1px solid var(--border);align-items:center;gap:8px;padding:12px 14px;display:flex}.list-header h2{font-size:.9rem;font-weight:600}.list-header .count{color:var(--muted);background:var(--bg);border-radius:10px;padding:2px 8px;font-size:.75rem}.list-search{border-bottom:1px solid var(--border);padding:8px 14px}.list-search input{border:1px solid var(--border);background:var(--bg);width:100%;color:var(--text);border-radius:6px;outline:none;padding:6px 10px;font-size:.82rem}.list-search input:focus{border-color:var(--accent)}.list-scroll{flex:1;overflow-y:auto}.sess-item{border-bottom:1px solid var(--border);cursor:pointer;padding:10px 14px;transition:background .1s}.sess-item:hover{background:#ffffff08}.sess-item.active{border-left:3px solid var(--accent);background:#22d3ee0f}.sess-item .row1{align-items:center;gap:8px;margin-bottom:4px;display:flex}.sess-item .sid{color:var(--muted);font-family:monospace;font-size:.72rem}.sess-item .stype{border-radius:4px;padding:1px 6px;font-size:.72rem;font-weight:500}.stype.shell{color:var(--green);background:#4ade8026}.stype.exec{color:var(--accent);background:#22d3ee26}.stype.sftp{color:var(--purple);background:#c084fc26}.sess-item .device{font-size:.82rem;font-weight:500}.sess-item .cmd{color:var(--muted);text-overflow:ellipsis;white-space:nowrap;max-width:100%;margin-top:2px;font-size:.75rem;overflow:hidden}.sess-item .meta{color:var(--muted);flex-wrap:wrap;gap:10px;margin-top:4px;font-size:.7rem;display:flex}.sess-item .meta .obs{color:var(--yellow)}.sess-item .meta .tk{color:var(--red)}.empty-list{text-align:center;color:var(--muted);padding:3rem 1rem}.empty-list .icon{opacity:.3;margin-bottom:.8rem;font-size:2.5rem}.attach-panel{flex-direction:column;flex:1;min-width:0;display:flex}.attach-header{background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0;align-items:center;gap:10px;padding:8px 12px;display:flex}.attach-header .info{color:var(--muted);white-space:nowrap;font-size:.8rem}.attach-header .info b{color:var(--text)}.mode-badge{color:var(--green);background:#4ade8026;border-radius:4px;padding:2px 8px;font-size:.72rem;font-weight:600}.btn{cursor:pointer;border:1px solid var(--border);background:var(--bg);color:var(--text);white-space:nowrap;border-radius:6px;align-items:center;gap:4px;padding:5px 12px;font-size:.78rem;transition:all .15s;display:inline-flex}.btn:hover{border-color:var(--accent);color:var(--accent)}.btn.danger{color:var(--red);border-color:#f871714d}.btn.danger:hover{background:#f871711a}.terminal-area{touch-action:manipulation;flex:1;min-height:0;padding:4px;position:relative;overflow:hidden}.terminal-area .xterm{height:100%}.mobile-keys{background:var(--card);border-top:1px solid var(--border);-webkit-overflow-scrolling:touch;flex-shrink:0;gap:6px;padding:6px 8px;display:none;overflow-x:auto}.mobile-keys button{border:1px solid var(--border);background:var(--bg);min-width:44px;min-height:34px;color:var(--text);border-radius:7px;padding:6px 10px;font-size:.8rem}.auth-overlay{z-index:10;background:#0f1117eb;justify-content:center;align-items:center;display:flex;position:absolute;inset:0}.auth-box{background:var(--card);border:1px solid var(--border);text-align:center;border-radius:16px;width:min(92vw,340px);padding:1.5rem}.auth-box h3{color:var(--accent);margin-bottom:.5rem;font-size:1.05rem}.auth-box p{color:var(--muted);margin-bottom:1rem;font-size:.85rem}.auth-box input{border:1px solid var(--border);background:var(--bg);width:100%;color:var(--text);border-radius:8px;outline:none;margin-bottom:.75rem;padding:10px 12px;font-size:16px}.auth-box input:focus{border-color:var(--accent)}.auth-box button{background:var(--accent);width:100%;color:var(--bg);border:0;border-radius:8px;padding:10px;font-weight:600}.auth-err{min-height:1.2em;color:var(--red);margin-top:.5rem;font-size:.8rem}.no-select{color:var(--muted);flex:1;justify-content:center;align-items:center;display:flex}.no-select .icon{opacity:.2;text-align:center;margin-bottom:1rem;font-size:4rem}.no-select .hint{text-align:center;font-size:.9rem}@media (width<=780px){.toolbar{flex-wrap:wrap;gap:6px;padding:6px 8px}.toolbar .logo{width:100%}.gh-link{display:none}.nav{width:100%;padding-bottom:2px;overflow-x:auto}.nav a{flex:none;padding:5px 9px}.split{flex-direction:column}.list-panel{border-right:0;border-bottom:1px solid var(--border);width:100%;min-width:0;max-height:38dvh}.list-header,.list-search,.sess-item{padding:8px 10px}.attach-header{flex-wrap:wrap;gap:6px;padding:6px 8px}.attach-header .info{white-space:normal}.terminal-area{padding:2px}.mobile-keys{display:flex}}</style>
</head>
<body>
    <div class="toolbar">
        <div class="logo">RDev <span data-i18n="sessions.title">Session Manager</span></div>
        <div class="spacer"></div>
        <a class="gh-link" href="https://github.com/icepie/rdev" target="_blank"><span class="icon-inline"><span data-icon="github"></span>GitHub</span></a>
        <div id="lang-slot"></div>
        <div class="nav">
            <a href="/" data-auth-link data-i18n="nav.dashboard">Dashboard</a>
            <a href="/terminal" data-auth-link data-i18n="nav.terminal">Terminal</a>
            <a href="/batch" data-auth-link data-i18n="nav.batch">Batch</a>
            <a href="/files" data-auth-link data-i18n="nav.files">Files</a>
            <a href="/sessions" data-auth-link data-i18n="nav.sessions">Sessions</a>
        </div>
    </div>

    <div class="split">
        <div class="list-panel">
            <div class="list-header">
                <h2 class="icon-inline"><span data-icon="sessions"></span><span data-i18n="sessions.active">活跃会话</span></h2>
                <span class="count" id="sess-count">0</span>
            </div>
            <div class="list-search">
                <input type="text" id="search" data-i18n-placeholder="sessions.searchPlaceholder" placeholder="搜索设备ID / 会话ID / 命令...">
            </div>
            <div class="list-scroll" id="sess-list"></div>
        </div>

        <div class="attach-panel" id="attach-panel" style="display:none">
            <div class="attach-header">
                <span class="info" id="attach-info"></span>
                <span class="mode-badge" id="mode-badge"><span data-i18n="sessions.writable">Writable</span></span>
                <div class="spacer"></div>
                <button class="btn danger" id="btn-detach"><span data-icon="close"></span><span data-i18n="sessions.detach">断开</span></button>
            </div>
            <div class="terminal-area" id="terminal-area"></div>
            <div class="mobile-keys" id="mobile-keys">
                <button data-key="\u001b">Esc</button><button data-key="\t">Tab</button><button data-key="\u0003">Ctrl+C</button><button data-key="\u0004">Ctrl+D</button>
                <button data-key="\u001b[A">↑</button><button data-key="\u001b[B">↓</button><button data-key="\u001b[D">←</button><button data-key="\u001b[C">→</button><button data-key="\r">Enter</button>
            </div>
        </div>

        <div class="no-select" id="no-select">
            <div>
                <div class="empty-icon" data-icon="sessions"></div>
                <div class="hint" data-i18n="sessions.emptyHint">选择左侧会话以附加</div>
            </div>
        </div>
    </div>

    <script src="/i18n.js"></script>
    <script src="/ui.js"></script>
    <script src="/vendor/xterm.js"></script>
    <script src="/vendor/xterm-addon-fit.js"></script>
    <script src="/vendor/xterm-addon-web-links.js"></script>
    <script src="/vendor/addon-image.js"></script>
    <script src="/terminal-images.js"></script>
    <script src="/vendor/addon-webgl.js"></script>
    <script>
    document.getElementById('lang-slot').innerHTML = RDevUI.themeButton() + RDevI18n.langSelector();
    RDevI18n.apply();
    document.querySelectorAll('[data-icon]').forEach(el => { el.innerHTML = icon(el.dataset.icon); });
    window.addEventListener('rdev:langchange', () => { if (typeof renderDevices === 'function') renderDevices(); if (typeof renderList === 'function') renderList(); });

    const adminToken = new URLSearchParams(location.search).get('token') || localStorage.getItem('rdevAdminToken') || '';
    if (adminToken) localStorage.setItem('rdevAdminToken', adminToken);
    function authURL(path) { return adminToken ? path + (path.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(adminToken) : path; }
    function authFetch(path, init) { return fetch(authURL(path), init); }
    document.querySelectorAll('[data-auth-link]').forEach(a => a.href = authURL(a.getAttribute('href')));

    const FitAddon = window.FitAddon;
    const WebLinksAddon = window.WebLinksAddon;
    const WebglAddon = window.AddonWebgl?.WebglAddon;

    let sessions = [], sessionsFingerprint = '', sessionsLoadSeq = 0;
    let activeId = null, term = null, fitAddon = null, imageWriter = null, ws = null, needAuth = false;
    let outputQueue = [], outputFlushScheduled = false, attachResizeTimer = null, lastResize = null;

    function flushAttachOutput() {
        outputFlushScheduled = false;
        if (!imageWriter) { outputQueue = []; return; }
        const started = performance.now();
        while (outputQueue.length) {
            imageWriter.write(outputQueue.shift());
            if (performance.now() - started > 12) {
                outputFlushScheduled = true;
                requestAnimationFrame(flushAttachOutput);
                return;
            }
        }
    }
    function enqueueAttachOutput(data) {
        outputQueue.push(data);
        if (!outputFlushScheduled) {
            outputFlushScheduled = true;
            requestAnimationFrame(flushAttachOutput);
        }
    }
    function drainAttachOutput() {
        if (!outputQueue.length || !imageWriter) return;
        const queued = outputQueue;
        outputQueue = [];
        outputFlushScheduled = false;
        queued.forEach(data => imageWriter.write(data));
    }
    function sendAttachResize(rows, cols) {
        if (!ws || ws.readyState !== WebSocket.OPEN || needAuth) return;
        if (lastResize && lastResize.rows === rows && lastResize.cols === cols) return;
        lastResize = { rows, cols };
        clearTimeout(attachResizeTimer);
        attachResizeTimer = setTimeout(() => {
            if (ws && ws.readyState === WebSocket.OPEN && !needAuth) {
                ws.send(JSON.stringify({ op: 'resize', rows, cols }));
            }
        }, 80);
    }

    function loadTerminalImageAddon(term) {
        if (!window.ImageAddon || !window.ImageAddon.ImageAddon) return null;
        try {
            const addon = new window.ImageAddon.ImageAddon({
                sixelSupport: true,
                iipSupport: true,
                sixelScrolling: true,
                pixelLimit: 8192 * 8192,
                sixelSizeLimit: 16 * 1024 * 1024,
                iipSizeLimit: 16 * 1024 * 1024,
                storageLimit: 64,
                showPlaceholder: true,
            });
            term.loadAddon(addon);
            return addon;
        } catch(e) {
            console.warn('RDev image addon disabled:', e);
            return null;
        }
    }

    function sendAttachData(data) {
        if (ws && ws.readyState === WebSocket.OPEN && !needAuth) ws.send(new TextEncoder().encode(data));
    }
    function prepareTerminalInput() {
        const textarea = document.querySelector('#terminal-area textarea');
        if (!textarea) return;
        textarea.setAttribute('inputmode', 'text');
        textarea.setAttribute('enterkeyhint', 'enter');
        textarea.setAttribute('autocapitalize', 'off');
        textarea.setAttribute('autocomplete', 'off');
        textarea.setAttribute('autocorrect', 'off');
        textarea.setAttribute('spellcheck', 'false');
        textarea.addEventListener('compositionend', () => setTimeout(() => { if (fitAddon) try { fitAddon.fit(); } catch(e) {} }, 30));
        textarea.addEventListener('focus', () => setTimeout(() => { if (fitAddon) try { fitAddon.fit(); } catch(e) {} }, 80));
    }

    function showAuthOverlay(session) {
        const area = document.getElementById('terminal-area');
        if (area.querySelector('.auth-overlay')) return;
        const overlay = document.createElement('div');
        overlay.className = 'auth-overlay';
        overlay.innerHTML = `<div class="auth-box">
            <h3 class="icon-inline">${icon('lock')}${t('sessions.authTitle')}</h3>
            <p>${t('sessions.authDesc', {id: esc(session.clientId)})}</p>
            <input type="password" id="session-auth-pw" placeholder="${t('terminal.passwordPlaceholder')}" autocomplete="current-password">
            <button id="session-auth-btn">${t('common.connect')}</button>
            <div class="auth-err" id="session-auth-err"></div>
        </div>`;
        area.appendChild(overlay);
        const input = document.getElementById('session-auth-pw');
        const button = document.getElementById('session-auth-btn');
        const savedPassword = RDevUI.getDevicePassword(session.clientId);
        if (savedPassword) input.value = savedPassword;
        const submit = () => {
            if (!ws || ws.readyState !== WebSocket.OPEN || !input.value) return;
            button.disabled = true;
            button.textContent = t('common.connecting');
            ws.send(JSON.stringify({ op: 'auth', password: input.value }));
        };
        button.addEventListener('click', submit);
        input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
        setTimeout(() => { input.focus(); if (savedPassword) submit(); }, 50);
    }

    function removeAuthOverlay() {
        const overlay = document.querySelector('#terminal-area .auth-overlay');
        if (overlay) overlay.remove();
    }

    function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

    // ── Session list ──
    async function loadSessions() {
        const seq = ++sessionsLoadSeq;
        try {
            const r = await authFetch('/api/sessions');
            const nextSessions = await r.json();
            if (seq !== sessionsLoadSeq) return;
            const nextFingerprint = JSON.stringify(nextSessions);
            if (nextFingerprint === sessionsFingerprint) return;
            sessionsFingerprint = nextFingerprint;
            sessions = nextSessions;
            document.getElementById('sess-count').textContent = sessions.length;
            renderList();
        } catch(e) { console.error('loadSessions', e); }
    }

    function renderList() {
        const q = document.getElementById('search').value.toLowerCase();
        const filtered = sessions.filter(s =>
            !q || s.clientId.toLowerCase().includes(q) || s.id.toLowerCase().includes(q) || (s.command||'').toLowerCase().includes(q)
        );
        const el = document.getElementById('sess-list');
        if (!filtered.length) {
            el.innerHTML = '<div class="empty-list"><div class="empty-icon">' + icon('inbox') + '</div>' + t('sessions.noActive') + '</div>';
            return;
        }
        el.innerHTML = filtered.map(s => {
            const active = s.id === activeId ? 'active' : '';
            const typeClass = s.type === 'shell' ? 'shell' : s.type === 'sftp' ? 'sftp' : 'exec';
            const cmdText = s.type === 'shell' ? t('sessions.interactiveShell') : s.type === 'sftp' ? t('sessions.sftpSession') : s.command || t('sessions.noCommand');
            const obsTag = s.observers > 0 ? `<span class="obs">${icon('monitor')} ${s.observers}</span>` : '';
            return `<div class="sess-item ${active}" data-id="${s.id}">
                <div class="row1">
                    <span class="stype ${typeClass}">${s.type.toUpperCase()}</span>
                    <span class="device">${esc(s.clientId)}</span>
                    <span class="sid">${s.id.slice(0,8)}…</span>
                </div>
                <div class="cmd">${esc(cmdText)}</div>
                <div class="meta">
                    <span>${s.pty ? s.term || 'xterm' : t('sessions.pipe')} ${s.cols}×${s.rows}</span>
                    <span>${timeAgo(s.createdAt)}</span>
                    ${obsTag}
                </div>
            </div>`;
        }).join('');
        el.querySelectorAll('.sess-item').forEach(item => {
            item.addEventListener('click', () => attachSession(item.dataset.id));
        });
    }

    function timeAgo(iso) {
        if (!iso) return '';
        const d = new Date(iso), s = Math.floor((Date.now()-d)/1000);
        if (s < 60) return t('common.justNow');
        if (s < 3600) return t('common.minutesAgo', {n: Math.floor(s/60)});
        if (s < 86400) return t('common.hoursAgo', {n: Math.floor(s/3600)});
        return t('common.daysAgo', {n: Math.floor(s/86400)});
    }

    document.getElementById('search').addEventListener('input', renderList);

    // ── Attach to session ──
    function attachSession(sessionID) {
        if (activeId === sessionID && ws && ws.readyState !== WebSocket.CLOSED) return;
        detachSession();

        activeId = sessionID;
        needAuth = false;
        outputQueue = [];
        outputFlushScheduled = false;
        lastResize = null;
        clearTimeout(attachResizeTimer);
        renderList();

        const sess = sessions.find(s => s.id === sessionID);
        if (!sess) return;

        document.getElementById('no-select').style.display = 'none';
        document.getElementById('attach-panel').style.display = 'flex';

        document.getElementById('attach-info').innerHTML = `<b>${esc(sess.clientId)}</b> · ${sess.type.toUpperCase()} · ${esc(sess.command || t('sessions.shell'))}`;
        // Create terminal
        const area = document.getElementById('terminal-area');
        area.innerHTML = '';

        term = new Terminal({
            cursorBlink: true, fontSize: 14,
            fontFamily: "'SF Mono','Fira Code','Cascadia Code',Menlo,Monaco,monospace",
            theme: {
                background: '#0f1117', foreground: '#e4e4e7',
                cursor: '#22d3ee', cursorAccent: '#0f1117',
                selectionBackground: 'rgba(34,211,238,0.25)',
                black: '#1a1d27', red: '#f87171', green: '#4ade80', yellow: '#facc15',
                blue: '#60a5fa', magenta: '#c084fc', cyan: '#22d3ee', white: '#e4e4e7',
                brightBlack: '#3f3f46', brightRed: '#fca5a5', brightGreen: '#86efac',
                brightYellow: '#fde68a', brightBlue: '#93c5fd', brightMagenta: '#d8b4fe',
                brightCyan: '#67e8f9', brightWhite: '#f4f4f5',
            },
            allowProposedApi: true,
        });

        fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.loadAddon(new WebLinksAddon.WebLinksAddon());
        loadTerminalImageAddon(term);
        imageWriter = RDevTerminalImages.create(term);
        term.open(area);
        prepareTerminalInput();
        try { const webgl = new WebglAddon(); webgl.onContextLoss(() => webgl.dispose()); term.loadAddon(webgl); } catch(e) {}
        try { fitAddon.fit(); } catch(e) {}

        // Connect WebSocket
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        ws = RDevUI.socket(`${proto}//${location.host}${authURL('/session?session=' + encodeURIComponent(sessionID))}`);
        ws.binaryType = 'arraybuffer';

        ws.onmessage = (evt) => {
            if (evt.data instanceof ArrayBuffer) {
                removeAuthOverlay();
                needAuth = false;
                enqueueAttachOutput(evt.data);
                return;
            }
            const msg = JSON.parse(evt.data);
            if (msg.op === 'auth') {
                needAuth = true;
                showAuthOverlay(sess);
            } else if (msg.op === 'auth_ok') {
                const input = document.getElementById('session-auth-pw');
                if (input && input.value) RDevUI.rememberDevicePassword(sess.clientId, input.value);
                needAuth = false;
                removeAuthOverlay();
                term.focus();
                try { fitAddon.fit(); } catch(e) {}
            } else if (msg.op === 'auth_fail') {
                RDevUI.forgetDevicePassword(sess.clientId);
                const err = document.getElementById('session-auth-err');
                const btn = document.getElementById('session-auth-btn');
                const input = document.getElementById('session-auth-pw');
                if (err) err.textContent = msg.message || t('common.passwordWrong');
                if (btn) { btn.disabled = false; btn.textContent = t('common.connect'); }
                if (input) { input.value = ''; input.focus(); }
            } else if (msg.op === 'exit') {
                drainAttachOutput();
                removeAuthOverlay();
                term.write('\r\n\x1b[33m[' + t('sessions.exitCode', {code: msg.code}) + ']\x1b[0m\r\n');
            } else if (msg.op === 'error') {
                drainAttachOutput();
                removeAuthOverlay();
                term.write('\r\n\x1b[31m[' + t('sessions.error', {message: msg.message}) + ']\x1b[0m\r\n');
            }
        };

        ws.onclose = () => {
            if (activeId === sessionID) {
                drainAttachOutput();
                term.write('\r\n\x1b[31m' + t('sessions.disconnected') + '\x1b[0m\r\n');
            }
        };

        term.onData(data => {
            sendAttachData(data);
        });

        term.onResize(({ cols, rows }) => {
            sendAttachResize(rows, cols);
        });
    }

    function detachSession() {
        if (ws) { const closing = ws; ws = null; closing.onclose = null; closing.close(); }
        clearTimeout(attachResizeTimer);
        drainAttachOutput();
        outputQueue = [];
        outputFlushScheduled = false;
        lastResize = null;
        removeAuthOverlay();
        if (term) { term.dispose(); term = null; }
        imageWriter = null;
        activeId = null;
        needAuth = false;
        document.getElementById('attach-panel').style.display = 'none';
        document.getElementById('no-select').style.display = 'flex';
        renderList();
    }

    document.getElementById('btn-detach').addEventListener('click', detachSession);
    document.getElementById('mobile-keys').addEventListener('click', (e) => {
        const btn = e.target.closest('button[data-key]');
        if (!btn) return;
        sendAttachData(btn.dataset.key);
        if (term) { term.focus(); setTimeout(() => { if (fitAddon) try { fitAddon.fit(); } catch(e) {} }, 50); }
    });
    document.getElementById('terminal-area').addEventListener('pointerdown', () => { if (term) term.focus(); });


    // ── Resize handling ──
    let resizeTimer;
    function scheduleResize(delay = 80) {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => { if (fitAddon) try { fitAddon.fit(); } catch(e) {} }, delay);
    }
    window.addEventListener('resize', () => scheduleResize(100));
    if (window.visualViewport) {
        visualViewport.addEventListener('resize', () => scheduleResize(80));
        visualViewport.addEventListener('scroll', () => scheduleResize(80));
    }

    // ── Auto-refresh session list ──
    loadSessions();
    setInterval(loadSessions, 3000);
    </script>
</body>
</html>
