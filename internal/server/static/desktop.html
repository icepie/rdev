<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <script src="/boot.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title.desktop">RDev Desktop</title>
    <style>:root{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark}:root[data-theme=dark]{--bg:#0f1117;--card:#1a1d27;--border:#2a2d3a;--text:#e4e4e7;--muted:#71717a;--accent:#22d3ee;--green:#4ade80;--red:#f87171;--yellow:#facc15}:root[data-theme=light]{--lightningcss-light:initial;--lightningcss-dark: ;color-scheme:light;--bg:#f6f8fb;--card:#fff;--border:#d8dee9;--text:#1f2937;--muted:#6b7280;--accent:#0891b2;--green:#16a34a;--red:#dc2626;--yellow:#ca8a04}*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);height:100dvh;color:var(--text);flex-direction:column;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;display:flex;overflow:hidden}.icon{vertical-align:-.16em;flex-shrink:0;width:1em;height:1em}.icon-inline{align-items:center;gap:6px;display:inline-flex}.theme-toggle{border:1px solid var(--border);background:var(--card);color:var(--muted);cursor:pointer;border-radius:7px;align-items:center;gap:6px;padding:4px 8px;font-size:.78rem;display:inline-flex}.toolbar{background:var(--card);border-bottom:1px solid var(--border);flex-shrink:0;align-items:center;gap:10px;padding:8px 12px;display:flex}.logo{color:var(--accent);white-space:nowrap;font-size:.9rem;font-weight:700}.spacer{flex:1}.nav{gap:6px;display:flex}.nav a{color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:.78rem;text-decoration:none}.nav a:hover{color:var(--accent);border-color:var(--accent)}.lang-switch{color:var(--muted);align-items:center;gap:6px;font-size:.78rem;display:inline-flex}.controls{background:var(--card);border-bottom:1px solid var(--border);flex-wrap:wrap;align-items:center;gap:8px;padding:10px 12px;display:flex}.controls select,.controls input{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:7px;outline:none;padding:7px 10px;font-size:.9rem}.controls input{min-width:180px}.controls input.small{width:86px;min-width:64px}.settings{background:var(--card);border-bottom:1px solid var(--border);color:var(--muted);flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;font-size:.82rem;display:flex}.settings label{white-space:nowrap;align-items:center;gap:5px;display:inline-flex}.settings select,.settings input{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:7px;outline:none;padding:5px 8px;font-size:.82rem}.settings input{width:72px}.settings input[type=checkbox]{width:auto}.settings input[type=range]{width:112px;padding:0}.settings output{min-width:42px;color:var(--text)}.settings .btn{padding:5px 9px;font-size:.82rem}.settings .fit-select{width:auto}.advanced-settings{border-top:1px solid var(--border);flex-wrap:wrap;align-items:center;gap:8px;width:100%;padding-top:6px;display:none}.advanced-settings.open{display:flex}.manual-settings[data-disabled=true]{opacity:.45;pointer-events:none}.btn{border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;border-radius:7px;padding:7px 12px}.btn:hover{border-color:var(--accent);color:var(--accent)}.status{color:var(--muted);font-size:.86rem}.status.ok{color:var(--green)}.status.warn{color:var(--yellow)}.status.err{color:var(--red)}.stage{overscroll-behavior:contain;flex:1;justify-content:center;align-items:center;min-height:0;padding:12px;display:flex;overflow:auto}.settings[data-gpu-device=true] .legacy-setting{display:none}.gpu-setting{display:none!important}.settings[data-gpu-device=true] .gpu-setting{display:inline-flex!important}.stage[data-gpu=true]{flex-direction:column;justify-content:stretch;align-items:stretch;gap:8px;overflow:hidden}.stage[data-fit=actual]{justify-content:flex-start;align-items:flex-start}.stage[data-gpu=true][data-fit=actual]{justify-content:stretch;align-items:stretch}.stage[data-control=true] canvas,.stage[data-control=true] .gpu-overlay{cursor:crosshair}.stage[data-cursor=true] canvas{cursor:none}canvas{border:1px solid var(--border);image-rendering:auto;background:#000;border-radius:10px;outline:none}.stage[data-fit=fit]>#screen{width:auto;max-width:100%;height:auto;max-height:100%}.stage[data-fit=actual]>#screen{width:auto;max-width:none;height:auto;max-height:none}.gpu-viewer{border:1px solid var(--border);background:#000;border-radius:10px;flex:1;width:100%;min-height:0;position:relative;overflow:hidden;box-shadow:0 16px 40px #0003}.gpu-viewer video,.gpu-viewer canvas{object-fit:contain;background:#000;width:100%;height:100%;display:block}.gpu-overlay{touch-action:none;outline:none;position:absolute;inset:0}.gpu-empty{text-align:center;color:var(--muted);pointer-events:none;background:radial-gradient(circle,#22d3ee12,#0000 42%);flex-direction:column;justify-content:center;align-items:center;padding:24px;line-height:1.8;display:flex;position:absolute;inset:0}.gpu-empty strong{color:var(--text);margin-bottom:4px;font-size:1rem}.empty{color:var(--muted);text-align:center;line-height:1.8}@media (width<=720px){.toolbar{flex-wrap:wrap}.nav{width:100%;overflow-x:auto}.controls>*{flex:auto}.stage{padding:6px}}</style>
  <script type="module" crossorigin src="/assets/desktop-CJGIcDgN.js"></script>
</head>
<body>
    <div class="toolbar">
        <div class="logo">RDev <span data-i18n="nav.desktop">Desktop</span></div>
        <div class="spacer"></div>
        <div id="lang-slot"></div>
        <div class="nav">
            <a href="/" data-auth-link data-i18n="nav.dashboard">Dashboard</a>
            <a href="/terminal" data-auth-link data-i18n="nav.terminal">Terminal</a>
            <a href="/files" data-auth-link data-i18n="nav.files">Files</a>
            <a href="/sessions" data-auth-link data-i18n="nav.sessions">Sessions</a>
            <a href="/remote-desktop" data-auth-link data-i18n="nav.desktop">Desktop</a>
        </div>
    </div>
    <div class="controls">
        <select id="device"><option value="" data-i18n="terminal.devicePlaceholder">-- device --</option></select>
        <input id="password" type="password" data-i18n-placeholder="terminal.passwordPlaceholder" placeholder="输入密码">
        <button class="btn" id="connect" data-i18n="common.connect">连接</button>
        <button class="btn" id="disconnect" data-i18n="desktop.disconnect">断开</button>
        <span id="status" class="status" data-i18n="desktop.idle">Idle</span>
    </div>
    <div class="settings" id="settings">
        <label class="legacy-setting"><span data-i18n="desktop.mode">Mode</span><select id="mode"><option value="auto" data-i18n="desktop.modeAuto">Auto</option><option value="manual" data-i18n="desktop.modeManual">Manual</option></select></label>
        <label class="legacy-setting"><span data-i18n="desktop.source">Source</span><select id="source"><option value="auto" data-i18n="desktop.sourceAuto">Auto</option><option value="screen:all" data-i18n="desktop.sourceAll">All screens</option></select></label>
        <span class="manual-settings legacy-setting" id="manual-settings">
            <label><span data-i18n="desktop.fps">FPS</span><input id="fps" type="number" min="1" max="12" value="4"></label>
            <label><span data-i18n="desktop.quality">Quality</span><input id="quality" type="number" min="25" max="90" value="50"></label>
            <label><span data-i18n="desktop.maxWidth">Max W</span><input id="maxWidth" type="number" min="320" max="3840" value="1600"></label>
            <label><span data-i18n="desktop.maxHeight">Max H</span><input id="maxHeight" type="number" min="240" max="2160" value="1000"></label>
        </span>
        <label class="gpu-setting"><span data-i18n="desktop.source">Source</span><select id="gpuSource"><option value="">正在读取画面来源...</option></select></label>
        <label class="gpu-setting"><span>Video</span><select id="gpuEncoder"><option value="auto">自动</option></select></label>
        <button class="btn gpu-setting" id="gpuRefresh">刷新来源</button>
        <button class="btn gpu-setting" id="gpuAdvancedToggle" type="button">高级</button>
        <label><input id="controlInput" type="checkbox" style="width:auto"> <span data-i18n="desktop.control">Control</span></label>
        <label><input id="showCursor" type="checkbox" style="width:auto"> <span data-i18n="desktop.showCursor">Show cursor</span></label>
        <label class="legacy-setting"><span data-i18n="desktop.inputBackend">Input</span><select id="inputBackend" class="fit-select"><option value="auto" data-i18n="desktop.inputAuto">Auto</option></select></label>
        <label><span data-i18n="desktop.view">View</span><select id="fitMode" class="fit-select"><option value="fit" data-i18n="desktop.fit">Fit</option><option value="actual" data-i18n="desktop.actual">Actual</option></select></label>
        <button class="btn legacy-setting" id="syncVNC" data-i18n="desktop.syncVNC">Sync to VNC</button>
        <button class="btn" id="screenshot" data-i18n="desktop.screenshot">Screenshot</button>
        <button class="btn" id="fullscreen" data-i18n="desktop.fullscreen">Fullscreen</button>
        <label><span data-i18n="desktop.clipboardSync">Clipboard sync</span><select id="clipboardSyncMode" class="fit-select" disabled><option value="off" data-i18n="desktop.clipboardOff">Off</option><option value="remote-to-local" data-i18n="desktop.clipboardRemoteToLocal">Remote → local</option><option value="local-to-remote" data-i18n="desktop.clipboardLocalToRemote">Local → remote</option><option value="bidirectional" data-i18n="desktop.clipboardBidirectional">Bidirectional</option></select></label>
        <span id="clipboardStatus" class="status" aria-live="polite"></span>
        <span id="frameInfo" class="status"></span>
        <div class="advanced-settings gpu-setting" id="gpuAdvanced">
            <label><input id="gpuEnableVideo" type="checkbox" checked> 视频</label>
            <label><input id="gpuLowLatency" type="checkbox" checked> 低延迟</label>
            <label><input id="gpuStretch" type="checkbox"> 拉伸</label>
            <label><input id="gpuEnableMouse" type="checkbox" checked> 鼠标</label>
            <label><input id="gpuEnablePen" type="checkbox" checked> 手写笔</label>
            <label><input id="gpuEnableTouch" type="checkbox" checked> 触控</label>
            <label>分辨率 <input id="gpuScale" type="range" min="0.1" max="2" step="0.01" value="1.5"><output id="gpuScaleOut">auto</output></label>
            <label>帧率 <input id="gpuFrameRate" type="range" min="0" max="120" step="1" value="30"><output id="gpuFrameRateOut">30</output></label>
            <label>鼠标输入 <select id="gpuPointerBackend" class="fit-select"><option value="auto">自动</option></select></label>
            <label>键盘输入 <select id="gpuKeyboardBackend" class="fit-select"><option value="auto">自动</option></select></label>
            <label>最小压感 <input id="gpuMinPressure" type="range" min="0" max="1" step="0.01" value="0"></label>
        </div>
    </div>
    <div class="stage" id="stage" data-fit="fit" data-gpu="false">
        <canvas id="screen" style="display:none" tabindex="0"></canvas>
        <div id="gpuViewer" class="gpu-viewer" style="display:none">
            <video id="gpuVideo" autoplay muted playsinline></video>
            <canvas id="gpuCanvas" style="display:none"></canvas>
            <div id="gpuOverlay" class="gpu-overlay" tabindex="0" aria-label="remote desktop input area"></div>
            <div id="gpuEmpty" class="gpu-empty"><strong>等待远程桌面画面</strong><span>连接后会自动读取画面来源并开始播放。</span></div>
        </div>
        <div id="empty" class="empty" data-i18n="desktop.empty">Select a device and connect.</div>
    </div>

    <script src="/i18n.js"></script>
    <script src="/ui.js"></script>

</body>
</html>
